spring.application.name=dcat-ap-se-processor

apitype.R10=RAML 1.0
apitype.O30j=OAS 3.0 json
apitype.O30y=OAS 3.0 yaml
apitype.json=JSON metadata

dcat.specification.properties=dcat_specification.properties

# Health metrics
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}

# api-info
# Name, version, release date and status live in static/openapi.yaml.
# Documentation URL is derived from the incoming request when left empty.
api-info.documentation=

# swagger
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true

# DEV settings for thymeleaf cache, not for prod
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0