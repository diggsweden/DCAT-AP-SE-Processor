<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html(~{::main}, ~{::script})}">
  <body>
    <main class="p-3">
      <h1 class="visually-hidden">Editor</h1>
      <div class="editor-grid grid">
        <div class="editor-panel border">
          <div class="tools d-flex align-center justify-between gap-2">
            <div class="d-flex gap-2">
              <button id="add-file-btn" class="btn-sm secondary d-flex">
                <span><i class="fa-solid fa-plus"></i></span>
                <span id="add-file-btn-text-lg" class="ml-1">Lägg till fil</span>
                <span id="add-file-btn-text-sm" class="hidden">Fil</span>
              </button>
              <label for="file-input" class="visually-hidden">Välj filer (JSON, YAML eller RAML)</label>
              <input type="file" id="file-input" accept=".json,.yaml,.yml,.raml" multiple hidden />
              <details id="language-dropdown" class="dropdown mb-0">
                <summary role="button" class="secondary btn-sm">Editor språk</summary>
                <ul class="dropdown-sm">
                  <li><a href="#" data-value="json" class="selected">JSON</a></li>
                  <li><a href="#" data-value="yaml">YAML/RAML</a></li>
                </ul>
              </details>
            </div>
            <button id="clear-btn" class="secondary btn-sm d-flex">
              <span><i class="fa-regular fa-trash-can"></i></span>
              <span id="clear-btn-text" class="ml-1">Rensa editor</span>
            </button>
          </div>
          <div id="file-tab-bar"></div>
          <div id="editor" class="flex-1" th:data-vs-path="@{/webjars/monaco-editor/0.55.1/min/vs}"></div>
          <div class="tools-bottom">
            <div class="d-flex align-center">
              <button id="generate-btn">Generera RDF</button>
            </div>
          </div>
        </div>
        <div id="right-main-panel">
          <nav>
            <ul id="tab-nav">
              <li class="p-0 mr-1">
                <button id="btn-info" class="selected secondary">Information</button>
              </li>
              <li class="p-0 mr-1"><button id="btn-dcat-form" class="secondary">Grundmall</button></li>
              <li class="p-0"><button id="btn-result" class="secondary">Resultat</button></li>
            </ul>
          </nav>
          <div id="panel-content-container" class="border">
            <div id="panel-user-guide" th:insert="~{fragments/info-user-guide :: user-guide}"></div>
            <div id="panel-dcat-form" class="hidden" th:insert="~{fragments/dcat-form :: dcat-form}"></div>
            <div id="panel-result" class="hidden" th:insert="~{fragments/result :: result}"></div>
          </div>
        </div>
      </div>
    </main>
    <script th:src="@{/webjars/js-yaml/4.3.1/dist/js-yaml.min.js}" defer></script>
    <script th:src="@{/webjars/monaco-editor/0.55.1/min/vs/loader.js}" defer></script>
    <script th:src="@{/js/editor.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/dcat-form.js}" defer></script>
  </body>
</html>
