  - it-development
  - compliance-management

developmentStatus: beta

softwareType: 'standalone/web'

description:
  en:
    shortDescription: Converts and validates API descriptions into DCAT-AP-SE metadata as RDF

    longDescription: |
      DCAT-AP-SE Processor generates metadata that conforms to the Swedish
      application profile DCAT-AP-SE, the profile used to describe datasets and
      data services published by Swedish public administrations.

      The tool reads an existing API description in YAML, RAML or JSON format and
      produces an RDF representation of it according to the profile. This means
      the metadata is derived from the API description that already exists,
      rather than being written and maintained by hand as a separate artefact,
      which reduces the risk of the two drifting apart over time.

      The tool is available as a web interface, REST API or CLI, and can be
      used interactively or run as a step in an existing publishing pipeline.

    features:
      - Generation of DCAT-AP-SE metadata as RDF from an existing API description
      - Support for YAML, RAML and JSON input formats
      - Validates input against DCAT-AP-SE specification
      - Web interface for interactive use
      - REST API for use in automated publishing pipelines
      - Runs interactively or as a step in a CI/CD pipeline

